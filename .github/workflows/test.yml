name: Test
# Runs the action from this checkout against a HomeCloud release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: HomeCloud release to test (e.g. v0.3.0)
        default: latest

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Input validation
        run: bash test/inputs.sh
      - id: homecloud
        uses: ./
        with:
          version: ${{ inputs.version || 'latest' }}
          services-wait: s3
      - name: AWS CLI against HomeCloud
        run: |
          set -eux
          test "$AWS_ENDPOINT_URL" = "${{ steps.homecloud.outputs.endpoint }}"
          aws sts get-caller-identity
          aws s3 mb s3://action-test
          echo hello | aws s3 cp - s3://action-test/hello.txt
          test "$(aws s3 cp s3://action-test/hello.txt -)" = hello
          url=$(aws sqs create-queue --queue-name action-test --query QueueUrl --output text)
          aws sqs send-message --queue-url "$url" --message-body hi
          test "$(aws sqs receive-message --queue-url "$url" --query 'Messages[0].Body' --output text)" = hi
          aws dynamodb create-table --table-name action-test \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST
          aws dynamodb put-item --table-name action-test --item '{"id":{"S":"1"}}'
          aws dynamodb get-item --table-name action-test --key '{"id":{"S":"1"}}'
          aws lambda list-functions
          homecloud version

  # Download and verification only (HC_INSTALL_ONLY stops before the server
  # starts): a signed release, an unsigned one, and the check turned off.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: latest, verify: "true", expect: "signature OK" }
          - { version: v0.5.0, verify: "true", expect: "signature OK" }
          - { version: v0.4.1, verify: "true", expect: "is not signed" }
          - { version: v0.5.0, verify: "false", expect: "verify-signature is false" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ${{ matrix.version }} (verify-signature ${{ matrix.verify }})
        env:
          HC_INSTALL_ONLY: "1"
          HC_VERSION: ${{ matrix.version }}
          HC_VERIFY_SIGNATURE: ${{ matrix.verify }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set -o pipefail
          bash setup.sh | tee install.log
          grep -q "$EXPECT" install.log
          grep -q "checksum OK" install.log
